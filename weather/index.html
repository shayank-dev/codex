<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Weather Check</h1>
      <div class="units" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="celsius" class="active">°C</button>
        <button type="button" data-unit="fahrenheit">°F</button>
      </div>
    </header>

    <form id="search" class="search" autocomplete="off">
      <input id="query" type="search" placeholder="Search a city…" aria-label="City" required>
      <button type="submit">Search</button>
      <button type="button" id="locate" title="Use my location" aria-label="Use my location">📍</button>
    </form>
    <ul id="results" class="results" hidden></ul>

    <p id="status" class="status" role="status"></p>

    <section id="weather" hidden>
      <div class="current card">
        <div>
          <h2 id="place"></h2>
          <p id="updated" class="muted"></p>
        </div>
        <div class="now">
          <span id="icon" class="icon"></span>
          <span id="temp" class="temp"></span>
        </div>
        <p id="summary" class="summary"></p>
        <dl class="details">
          <div><dt>Feels like</dt><dd id="feels"></dd></div>
          <div><dt>Humidity</dt><dd id="humidity"></dd></div>
          <div><dt>Wind</dt><dd id="wind"></dd></div>
          <div><dt>Precip.</dt><dd id="precip"></dd></div>
        </dl>
      </div>

      <h3>Next 24 hours</h3>
      <div id="hourly" class="hourly card"></div>

      <h3>7-day forecast</h3>
      <ol id="daily" class="daily card"></ol>
    </section>

    <footer class="muted">Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
